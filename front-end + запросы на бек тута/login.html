    <script>
        $(document).ready(function(){
            $("#authForm").submit(function(event){
                event.preventDefault();
                var username = $('input[name="username"]').val();
                var password = $('input[name="password"]').val();
                var url = "http://localhost:1000/auth/login?username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password);
                
                $.ajax({
                    type: "POST",
                    url: url,
                    contentType: "application/x-www-form-urlencoded",
                    success: function(response){
                        if (response.Success) {
                            localStorage.setItem('token', response.Success);
                            $("#result").css("color", "green");
                            $("#result").css("text-shadow", "0 0 12px rgba(0, 255, 0, 0.9)");
                            $("#result").html("Успешно");
                            setTimeout(function(){
                                window.location.href = "cabinet.html";
                            }, 1000);
                        } else {
                            var errorMessage = "Ошибка авторизации";
                            for (var key in response) {
                                if (key !== "Success") {
                                    errorMessage = response[key];
                                    break;
                                }
                            }
                            $("#result").css("color", "red");
                            $("#result").css("text-shadow", "0 0 12px rgba(255, 0, 0, 0.9)");
                            $("#result").html(errorMessage);
                        }
                    },
                    error: function(xhr, status, error){
                        var errorMessage = "Ошибка авторизации";
                        if (xhr.responseJSON) {
                            for (var key in xhr.responseJSON) {
                                if (key !== "Success") {
                                    errorMessage = xhr.responseJSON[key];
                                    break;
                                }
                            }
                        } else if (xhr.responseText) {
                            try {
                                var response = JSON.parse(xhr.responseText);
                                for (var key in response) {
                                    if (key !== "Success") {
                                        errorMessage = response[key];
                                        break;
                                    }
                                }
                            } catch(e) {
                                errorMessage = xhr.responseText || "Неизвестная ошибка";
                            }
                        }
                        $("#result").css("color", "red");
                        $("#result").css("text-shadow", "0 0 12px rgba(255, 0, 0, 0.9)");
                        $("#result").html(errorMessage);
                    }
                });
            });
        });
    </script>
